name = "web-push-app"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

# No nodejs_compat flag: the library uses only Web Crypto and fetch.

[assets]
directory = "./public"

[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
# Replace with the id that `wrangler kv namespace create SUBSCRIPTIONS` prints.
id = "replace-with-your-namespace-id"
