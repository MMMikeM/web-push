name: browsers

# Real delivery through a browser's push service, called by chrome.yml and
# firefox.yml so each has a status badge of its own.
on:
  workflow_call:
    inputs:
      browser:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Playwright runs here; keep the token out of .git/config.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm ci
      - run: pnpm run build
      - run: pnpm --dir e2e install --frozen-lockfile

      # The runner image already has Google Chrome, which is the one with
      # credentials for Google's push service.
      # No --with-deps: the image has the libraries headless Firefox needs, and
      # the extra fonts and codecs came from an apt mirror that stalled the job.
      - if: inputs.browser == 'firefox'
        timeout-minutes: 3
        run: pnpm --dir e2e exec playwright install firefox

      - run: pnpm --dir e2e run browsers ${{ inputs.browser }}
