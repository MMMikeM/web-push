name: release

# Triggered by pushing a version tag, e.g. `git tag v0.2.0 && git push --tags`.
# Publishes to npm and creates a GitHub Release whose notes are the matching
# hand-written section of CHANGELOG.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (supply-chain: a tag can be moved to
      # point at malicious code; a SHA can't). Comments track the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No version pinned here — pnpm/action-setup reads it from the
      # "packageManager" field in package.json (single source of truth).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm ci

      # No `pnpm run check` step: `prepublishOnly` runs the full gate before the
      # publish below, and covers manual `pnpm publish` too. Per-push CI is ci.yml.

      - name: Derive version, dist-tag, and release notes
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Prereleases (e.g. 0.3.0-beta.0) publish under their own npm dist-tag
          # (beta, rc, ...) and are flagged as prereleases on GitHub — never `latest`.
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"; TAG="${TAG%%.*}"
            echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          node scripts/extract-changelog.ts "$VERSION" > RELEASE_NOTES.md
          echo "--- release notes ---"; cat RELEASE_NOTES.md

      - name: Guard — tag must match package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::tag v$VERSION does not match package.json ($PKG)"
            exit 1
          fi
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      # Tag-derived values go through `env:`, never `${{ }}` interpolation: git
      # permits characters a shell would treat as syntax.
      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}

      - name: Create GitHub Release
        run: |
          if [ "$PRERELEASE" = "true" ]; then PRERELEASE_FLAG=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --notes-file RELEASE_NOTES.md \
            ${PRERELEASE_FLAG:-}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
