name: firefox

# Delivery through Mozilla's push service. The daily run catches the browser
# or push service changing while no commits land.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Keyed by event too, so a push to main can't cancel the daily run.
concurrency:
  group: firefox-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deliver:
    uses: ./.github/workflows/browsers.yml
    with:
      browser: firefox
