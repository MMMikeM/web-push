name: deno

# The built package on Deno.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deno-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    uses: ./.github/workflows/conformance.yml
    with:
      runtimes: '["deno"]'
